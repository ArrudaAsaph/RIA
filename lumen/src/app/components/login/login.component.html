<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-purple-100 p-4">
  <div class="w-full max-w-md">

    <!-- Card Container -->
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">

      <!-- Header -->
      <div class="bg-gradient-to-r from-blue-600 to-purple-600 p-8 text-center">
        <div class="mb-4">
        
          <h1 class="text-3xl font-bold text-white">Solar Energy</h1>
          <p class="text-blue-100 mt-2">Sistema de Gestão de Energia Solar</p>
        </div>
      </div>

      <!-- Formulário -->
      <div class="p-8">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Login</h2>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

          <!-- Usuário -->
          <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Usuário
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
              </div>
              <input
                type="text"
                formControlName="username"
                placeholder="Digite seu usuário"
                class="pl-10 w-full px-4 py-3 border border-gray-300 rounded-lg
                       focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                [ngClass]="{
                  'border-red-500 focus:ring-red-500 focus:border-red-500':
                  submitted && f['username'].errors
                }">
            </div>
            <p *ngIf="submitted && f['username'].errors"
               class="mt-2 text-sm text-red-600">
              Usuário é obrigatório
            </p>
          </div>

          <!-- Senha -->
          <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Senha
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z" />
                </svg>
              </div>
              <input
                type="password"
                formControlName="password"
                placeholder="Digite sua senha"
                class="pl-10 w-full px-4 py-3 border border-gray-300 rounded-lg
                       focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                [ngClass]="{
                  'border-red-500 focus:ring-red-500 focus:border-red-500':
                  submitted && f['password'].errors
                }">
            </div>
            <p *ngIf="submitted && f['password'].errors"
               class="mt-2 text-sm text-red-600">
              Senha é obrigatória
            </p>
          </div>

          <!-- Botão -->
          <button
            type="submit"
            [disabled]="loading"
            class="w-full py-3 px-4 text-white font-semibold rounded-lg
                   bg-gradient-to-r from-blue-600 to-purple-600
                   hover:from-blue-700 hover:to-purple-700
                   shadow-md hover:shadow-lg
                   focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2
                   disabled:opacity-50 disabled:cursor-not-allowed">

            <span *ngIf="!loading">Entrar</span>

            <span *ngIf="loading" class="flex items-center justify-center gap-2">
              <svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10"
                  stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor"
                  d="M4 12a8 8 0 018-8V0" />
              </svg>
              Carregando...
            </span>
          </button>

          <!-- Erro -->
          <div *ngIf="error"
               class="mt-6 p-4 bg-red-50 border border-red-200 rounded-lg flex gap-3">
            <svg class="h-5 w-5 text-red-500 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 8v4m0 4h.01" />
            </svg>
            <p class="text-sm text-red-700">{{ error }}</p>
          </div>

          <!-- Registro -->
          <div class="mt-8 text-center text-gray-600">
            Não tem uma conta?
            <a routerLink="/register"
               class="font-semibold text-blue-600 hover:text-blue-700 ml-1">
              Cadastre-se
            </a>
          </div>

        </form>
      </div>

      <!-- Footer -->
      <div class="px-8 py-4 bg-gray-50 border-t border-gray-200">
        <p class="text-center text-sm text-gray-500">
          © 2024 Solar Energy Solutions. Todos os direitos reservados.
        </p>
      </div>

    </div>
  </div>
</div>
