<div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">

  <div class="bg-gradient-to-br from-blue-50 to-blue-100 border border-blue-200 rounded-xl shadow-sm p-5 text-center">
    <div class="text-3xl font-bold text-blue-700">
      {{ clientes.length }}
    </div>
    <div class="mt-1 text-sm font-medium text-blue-900/70">
      Total de Clientes
    </div>
  </div>

  <div class="bg-gradient-to-br from-green-50 to-green-100 border border-green-200 rounded-xl shadow-sm p-5 text-center">
    <div class="text-3xl font-bold text-green-700">
      {{ getClientesAtivos() }}
    </div>
    <div class="mt-1 text-sm font-medium text-green-900/70">
      Clientes Ativos
    </div>
  </div>

  <div class="bg-gradient-to-br from-orange-50 to-orange-100 border border-orange-200 rounded-xl shadow-sm p-5 text-center">
    <div class="text-3xl font-bold text-orange-700">
      {{ getCapacidadeTotal() }} <span class="text-lg">kW</span>
    </div>
    <div class="mt-1 text-sm font-medium text-orange-900/70">
      Capacidade Total
    </div>
  </div>

  <div class="bg-gradient-to-br from-purple-50 to-purple-100 border border-purple-200 rounded-xl shadow-sm p-5 text-center">
    <div class="text-3xl font-bold text-purple-700">
      {{ formatarMoeda(getInvestimentoTotal()) }}
    </div>
    <div class="mt-1 text-sm font-medium text-purple-900/70">
      Investimento Total
    </div>
  </div>

</div>
