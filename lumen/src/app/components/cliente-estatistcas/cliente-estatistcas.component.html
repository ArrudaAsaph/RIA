<div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
  <div class="bg-white rounded-lg shadow p-4 text-center">
    <div class="text-2xl font-bold text-blue-600">{{ clientes.length }}</div>
    <div class="text-gray-600">Total Clientes</div>
  </div>
  
  <div class="bg-white rounded-lg shadow p-4 text-center">
    <div class="text-2xl font-bold text-green-600">{{ getClientesAtivos() }}</div>
    <div class="text-gray-600">Clientes Ativos</div>
  </div>
  
  <div class="bg-white rounded-lg shadow p-4 text-center">
    <div class="text-2xl font-bold text-orange-600">{{ getCapacidadeTotal() }} kW</div>
    <div class="text-gray-600">Capacidade Total</div>
  </div>
  
  <div class="bg-white rounded-lg shadow p-4 text-center">
    <div class="text-2xl font-bold text-purple-600">{{ formatarMoeda(getInvestimentoTotal()) }}</div>
    <div class="text-gray-600">Investimento Total</div>
  </div>
</div>
