<div *ngIf="mostrarDialog" class="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
  <div class="bg-slate-50 rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">

    <div class="px-6 py-4 bg-gradient-to-r from-blue-600 to-indigo-600">
      <h2 class="text-xl font-semibold text-white">
        {{ editando ? 'Editar Cliente' : 'Novo Cliente' }}
      </h2>
    </div>

    <div class="p-6 space-y-4 bg-white">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Nome *</label>
        <input 
          type="text"
          [(ngModel)]="cliente.nome"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-slate-50">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Email *</label>
        <input 
          type="email"
          [(ngModel)]="cliente.email"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-slate-50">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Telefone</label>
        <input 
          type="text"
          [(ngModel)]="cliente.telefone"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-slate-50">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Endereço</label>
        <input 
          type="text"
          [(ngModel)]="cliente.endereco"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-slate-50">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Tamanho do Sistema (kW)</label>
        <input 
          type="number"
          [(ngModel)]="cliente.tamanhoSistema"
          min="1"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-slate-50">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Custo Total (R$)</label>
        <input 
          type="number"
          [(ngModel)]="cliente.custoTotal"
          min="0"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-slate-50">
      </div>

      <div class="flex items-center gap-2 pt-2">
        <input 
          type="checkbox"
          [(ngModel)]="cliente.ativo"
          id="ativo"
          class="w-4 h-4 text-green-600 border-slate-300 rounded focus:ring-green-500">
        <label for="ativo" class="text-sm font-medium text-slate-700">
          Cliente Ativo
        </label>
      </div>
    </div>

    <div class="px-6 py-4 bg-slate-100 border-t flex justify-end gap-3">
      <button 
        (click)="onCancelar()"
        class="px-4 py-2 rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-200 transition">
        Cancelar
      </button>
      <button 
        (click)="onSalvar()"
        class="px-5 py-2 rounded-lg bg-green-600 hover:bg-green-700 text-white font-medium shadow">
        {{ editando ? 'Atualizar' : 'Salvar' }}
      </button>
    </div>

  </div>
</div>
