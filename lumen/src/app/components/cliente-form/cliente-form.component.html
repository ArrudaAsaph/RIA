<div *ngIf="mostrarDialog" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
  <div class="bg-white rounded-lg shadow-xl w-full max-w-md">
    <!-- Header -->
    <div class="p-4 border-b">
      <h2 class="text-xl font-semibold">{{ editando ? 'Editar Cliente' : 'Novo Cliente' }}</h2>
    </div>

    <!-- Form -->
    <div class="p-4 space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Nome *</label>
        <input 
          type="text"
          [(ngModel)]="cliente.nome"
          class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Email *</label>
        <input 
          type="email"
          [(ngModel)]="cliente.email"
          class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Telefone</label>
        <input 
          type="text"
          [(ngModel)]="cliente.telefone"
          class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Endereço</label>
        <input 
          type="text"
          [(ngModel)]="cliente.endereco"
          class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Tamanho do Sistema (kW)</label>
        <input 
          type="number"
          [(ngModel)]="cliente.tamanhoSistema"
          min="1"
          class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Custo Total (R$)</label>
        <input 
          type="number"
          [(ngModel)]="cliente.custoTotal"
          min="0"
          class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent">
      </div>

      <div class="flex items-center">
        <input 
          type="checkbox"
          [(ngModel)]="cliente.ativo"
          id="ativo"
          class="mr-2">
        <label for="ativo" class="text-sm font-medium">Cliente Ativo</label>
      </div>
    </div>

    <!-- Footer -->
    <div class="p-4 border-t flex justify-end gap-2">
      <button 
        (click)="onCancelar()"
        class="px-4 py-2 text-gray-600 hover:text-gray-800">
        Cancelar
      </button>
      <button 
        (click)="onSalvar()"
        class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded">
        {{ editando ? 'Atualizar' : 'Salvar' }}
      </button>
    </div>
  </div>
</div>
