<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-purple-100 p-4">
  <div class="w-full max-w-2xl">

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">

      <!-- Header -->
      <div class="bg-gradient-to-r from-blue-600 to-purple-600 p-8 text-center">
        <div class="mb-4">
          <div class="inline-flex items-center justify-center w-16 h-16 bg-white/20 rounded-full mb-4">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0z" />
            </svg>
          </div>
          <h1 class="text-3xl font-bold text-white">Criar Conta</h1>
          <p class="text-blue-100 mt-2">Junte-se ao sistema de energia solar</p>
        </div>
      </div>

      <!-- Conteúdo -->
      <div class="p-8">

        <!-- Sucesso -->
        <div *ngIf="success"
             class="mb-6 p-4 bg-green-50 border border-green-200 rounded-lg flex gap-3">
          <svg class="h-5 w-5 text-green-500 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M5 13l4 4L19 7" />
          </svg>
          <p class="text-sm text-green-700">
            Conta criada com sucesso! Redirecionando para o sistema...
          </p>
        </div>

        <!-- Form -->
        <form *ngIf="!success" [formGroup]="registerForm" (ngSubmit)="onSubmit()">

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <!-- Usuário -->
            <div class="col-span-2">
              <label class="block text-sm font-medium text-gray-700 mb-2">Usuário *</label>
              <input type="text" formControlName="username"
                placeholder="Escolha um nome de usuário"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg
                       focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                [ngClass]="{
                  'border-red-500 focus:ring-red-500 focus:border-red-500':
                  submitted && f['username'].errors
                }">
              <p *ngIf="submitted && f['username'].errors"
                 class="mt-2 text-sm text-red-600">
                Usuário inválido
              </p>
            </div>

            <!-- Email -->
            <div class="col-span-2">
              <label class="block text-sm font-medium text-gray-700 mb-2">Email *</label>
              <input type="email" formControlName="email"
                placeholder="seu.email@exemplo.com"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg
                       focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                [ngClass]="{
                  'border-red-500 focus:ring-red-500 focus:border-red-500':
                  submitted && f['email'].errors
                }">
            </div>

            <!-- Senha -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Senha *</label>
              <input type="password" formControlName="password"
                placeholder="Mínimo 6 caracteres"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg
                       focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                [ngClass]="{
                  'border-red-500 focus:ring-red-500 focus:border-red-500':
                  submitted && f['password'].errors
                }">
            </div>

            <!-- Confirmar -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Confirmar Senha *</label>
              <input type="password" formControlName="confirmPassword"
                placeholder="Digite novamente"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg
                       focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                [ngClass]="{
                  'border-red-500 focus:ring-red-500 focus:border-red-500':
                  submitted && f['confirmPassword'].errors
                }">
            </div>

            <!-- Nome -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Nome</label>
              <input type="text" formControlName="first_name"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg
                       focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
            </div>

            <!-- Sobrenome -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Sobrenome</label>
              <input type="text" formControlName="last_name"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg
                       focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
            </div>

          </div>

          <!-- Erro -->
          <div *ngIf="error"
               class="mt-6 p-4 bg-red-50 border border-red-200 rounded-lg flex gap-3">
            <svg class="h-5 w-5 text-red-500 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 8v4m0 4h.01" />
            </svg>
            <p class="text-sm text-red-700">{{ error }}</p>
          </div>

          <!-- Botões -->
          <div class="mt-8 flex flex-col sm:flex-row gap-4">

            <button type="submit" [disabled]="loading"
              class="flex-1 py-3 px-4 text-white font-semibold rounded-lg
                     bg-gradient-to-r from-blue-600 to-purple-600
                     hover:from-blue-700 hover:to-purple-700
                     focus:ring-2 focus:ring-blue-500 focus:ring-offset-2
                     disabled:opacity-50">
              Criar Conta
            </button>

            <a routerLink="/login"
              class="flex-1 py-3 px-4 text-center font-semibold rounded-lg
                     border-2 border-blue-600 text-blue-600
                     hover:bg-blue-50 transition">
              Voltar para Login
            </a>

          </div>

          <!-- Info -->
          <div class="mt-8 p-4 bg-blue-50 rounded-lg flex gap-3">
            <svg class="h-5 w-5 text-blue-500 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M13 16h-1v-4h-1m1-4h.01" />
            </svg>
            <p class="text-sm text-blue-700">
              Campos com * são obrigatórios. Após o cadastro, você terá acesso completo ao sistema.
            </p>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>
