<div class="bg-white rounded-lg shadow overflow-hidden">
  <table class="min-w-full">
    <thead class="bg-gray-100">
      <tr>
        <th class="p-3 text-left">Nome</th>
        <th class="p-3 text-left">Email</th>
        <th class="p-3 text-left">Telefone</th>
        <th class="p-3 text-left">Sistema (kW)</th>
        <th class="p-3 text-left">Investimento</th>
        <th class="p-3 text-left">Status</th>
        <th class="p-3 text-left">Operações</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let cliente of clientes" class="border-b hover:bg-gray-50">
        <td class="p-3 font-semibold">{{ cliente.nome }}</td>
        <td class="p-3">{{ cliente.email }}</td>
        <td class="p-3">{{ cliente.telefone }}</td>
        <td class="p-3">{{ cliente.tamanhoSistema }}</td>
        <td class="p-3 text-green-600 font-semibold">{{ formatarMoeda(cliente.custoTotal) }}</td>
        <td class="p-3">
          <span [class]="cliente.ativo ? 'text-green-600' : 'text-red-600'">
            {{ cliente.ativo ? 'Ativo' : 'Inativo' }}
          </span>
        </td>
        <td class="p-3">
          <div class="flex gap-2">
            <button 
              (click)="editar.emit(cliente)"
              class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-1 rounded text-sm">
              Editar
            </button>
            <button 
              (click)="excluir.emit(cliente)"
              class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm">
              Excluir
            </button>
          </div>
        </td>
      </tr>
      <tr *ngIf="clientes.length === 0">
        <td colspan="7" class="p-6 text-center text-gray-500">
          Nenhum cliente cadastrado.
        </td>
      </tr>
    </tbody>
  </table>
</div>
