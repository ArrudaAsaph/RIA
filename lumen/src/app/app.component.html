<nav
  *ngIf="isLoggedIn()"
  class="sticky top-0 z-50 bg-gradient-to-r from-blue-600 via-blue-700 to-indigo-700 shadow-xl backdrop-blur-md border-b border-white/10"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16">

      <div class="flex items-center space-x-8">

         <span class="text-lg font-bold tracking-wide text-white">
            Solar Energy
          </span>
      

        <div class="hidden sm:flex space-x-2">
          <a
            [routerLink]="['/clientes']"
            routerLinkActive="bg-white/20"
            class="px-4 py-2 rounded-lg text-sm font-medium text-white hover:bg-white/10 transition"
          >
            Clientes
          </a>
          <a
            [routerLink]="['/relatorios']"
            routerLinkActive="bg-white/20"
            class="px-4 py-2 rounded-lg text-sm font-medium text-white hover:bg-white/10 transition"
          >
            Relatórios
          </a>
          <a
            [routerLink]="['/configuracoes']"
            routerLinkActive="bg-white/20"
            class="px-4 py-2 rounded-lg text-sm font-medium text-white hover:bg-white/10 transition"
          >
            Configurações
          </a>
        </div>
      </div>

      <div class="flex items-center">
        <div class="relative" *ngIf="currentUser">
          <button
            (click)="toggleUserMenu()"
            class="flex items-center gap-3 px-3 py-2 rounded-full bg-white/10 hover:bg-white/20 transition focus:outline-none focus:ring-2 focus:ring-white/40"
          >
            <div class="w-9 h-9 flex items-center justify-center rounded-full bg-white text-blue-700 font-bold">
              {{ (currentUser.first_name || currentUser.username)[0] | uppercase }}
            </div>

            <span class="hidden sm:block text-sm font-medium text-white">
              {{ currentUser.first_name || currentUser.username }}
            </span>

            <svg class="w-4 h-4 text-white opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </button>

          <div
            *ngIf="userMenuOpen"
            class="absolute right-0 mt-3 w-52 bg-white rounded-xl shadow-xl overflow-hidden border border-gray-100"
          >
            <div class="px-4 py-3 border-b">
              <p class="text-sm font-semibold text-gray-800 truncate">
                {{ currentUser.first_name || currentUser.username }}
              </p>
              <p class="text-xs text-gray-500 truncate">
                {{ currentUser.email }}
              </p>
            </div>

            <a
              href="#"
              (click)="logout(); $event.preventDefault()"
              class="flex items-center px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 transition"
            >
              <svg class="w-5 h-5 mr-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M17 16l4-4m0 0l-4-4m4 4H7" />
              </svg>
              Sair
            </a>
          </div>
        </div>
      </div>

      <div class="flex items-center sm:hidden">
        <button
          (click)="toggleMobileMenu()"
          class="p-2 rounded-lg text-white hover:bg-white/10 transition"
        >
          <svg *ngIf="!mobileMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16" />
          </svg>
          <svg *ngIf="mobileMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

    </div>
  </div>
</nav>


<main class="max-w-7xl mx-auto mt-4  min-h-screen bg-gradient-to-b ">
  <router-outlet></router-outlet>
</main>


<footer *ngIf="isLoggedIn()" class="bg-gradient-primary text-white py-4">
  <div class="max-w-7xl mx-auto  px-4 sm:px-6 lg:px-8">
    <div class="flex flex-col md:flex-row justify-between items-center">
      <div class="mb-4 md:mb-0">
        <p class="text-sm">© 2024 Solar Energy Solutions. Todos os direitos reservados.</p>
      </div>
      <div class="flex space-x-6">
        <a href="#" class="text-white hover:text-blue-100 text-sm transition duration-150">Termos de Uso</a>
        <a href="#" class="text-white hover:text-blue-100 text-sm transition duration-150">Política de Privacidade</a>
        <a href="#" class="text-white hover:text-blue-100 text-sm transition duration-150">Suporte</a>
      </div>
    </div>
  </div>
</footer>
