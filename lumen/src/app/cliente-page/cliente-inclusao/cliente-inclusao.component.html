<div class="bg-white rounded-lg shadow p-6">
  <div class="flex justify-between items-center mb-6">
    <div>
      <h2 class="text-2xl font-bold text-gray-800">Cadastrar Novo Cliente</h2>
      <p class="text-gray-600">Preencha os dados do novo cliente de energia solar</p>
    </div>
    <a 
      routerLink="/clientes"
      class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded transition-colors">
      Voltar
    </a>
  </div>

  <form (ngSubmit)="salvar()" class="space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Coluna 1: Informações Pessoais -->
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nome Completo *</label>
          <input 
            type="text"
            [(ngModel)]="cliente.nome"
            name="nome"
            required
            class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            placeholder="Digite o nome completo">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email *</label>
          <input 
            type="email"
            [(ngModel)]="cliente.email"
            name="email"
            required
            class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            placeholder="exemplo@email.com">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Telefone</label>
          <input 
            type="text"
            [(ngModel)]="cliente.telefone"
            name="telefone"
            class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            placeholder="(11) 99999-9999">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Endereço</label>
          <input 
            type="text"
            [(ngModel)]="cliente.endereco"
            name="endereco"
            class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            placeholder="Rua, número, bairro, cidade">
        </div>
      </div>

      <!-- Coluna 2: Informações do Sistema -->
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Tamanho do Sistema (kW) *</label>
          <input 
            type="number"
            [(ngModel)]="cliente.tamanhoSistema"
            name="tamanhoSistema"
            required
            min="0.1"
            step="0.1"
            class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            placeholder="Ex: 5.5">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Custo Total (R$) *</label>
          <input 
            type="number"
            [(ngModel)]="cliente.custoTotal"
            name="custoTotal"
            required
            min="0"
            step="100"
            class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            placeholder="0,00">
        </div>

        <div class="pt-4">
          <div class="flex items-center p-3 bg-gray-50 rounded-lg">
            <input 
              type="checkbox"
              [(ngModel)]="cliente.ativo"
              name="ativo"
              id="ativo"
              class="w-4 h-4 text-green-500 rounded focus:ring-green-400">
            <label for="ativo" class="ml-2 text-sm font-medium text-gray-700">
              Cliente ativo
            </label>
          </div>
          <p class="text-xs text-gray-500 mt-1">Desmarque esta opção se o cliente estiver inativo no sistema</p>
        </div>
      </div>
    </div>

    <!-- Ações -->
    <div class="pt-6 border-t">
      <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
        <div class="text-sm text-gray-500">
          <p><span class="text-red-500">*</span> Campos obrigatórios</p>
        </div>
        
        <div class="flex gap-3">
          <button 
            type="button"
            (click)="cancelar()"
            class="px-6 py-2 border border-gray-300 text-gray-700 rounded hover:bg-gray-50 transition-colors">
            Cancelar
          </button>
          
          <button 
            type="submit"
            class="px-6 py-2 bg-green-500 text-white rounded hover:bg-green-600 transition-colors flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
            Cadastrar Cliente
          </button>
        </div>
      </div>
    </div>
  </form>
</div>
