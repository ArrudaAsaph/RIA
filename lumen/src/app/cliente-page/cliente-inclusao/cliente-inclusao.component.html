<div class="bg-slate-50 rounded-xl shadow-lg p-6 border border-slate-200">
  <div class="flex justify-between items-center mb-8">
    <div>
      <h2 class="text-2xl font-bold text-slate-800">Cadastrar Novo Cliente</h2>
      <p class="text-slate-500">Preencha os dados do novo cliente de energia solar</p>
    </div>
    <a 
      routerLink="/clientes"
      class="bg-slate-600 hover:bg-slate-700 text-white px-5 py-2.5 rounded-lg transition shadow-sm">
      Voltar
    </a>
  </div>

  <div *ngIf="erro" class="mb-4 p-4 bg-rose-50 border border-rose-200 text-rose-700 rounded-lg">
    {{ erro }}
  </div>

  <div *ngIf="enviando" class="mb-4 p-4 bg-indigo-50 border border-indigo-200 text-indigo-700 rounded-lg">
    Salvando cliente...
  </div>

  <form (ngSubmit)="salvar()" class="space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Nome Completo *</label>
          <input 
            type="text"
            [(ngModel)]="cliente.nome"
            name="nome"
            required
            class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
            placeholder="Digite o nome completo">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Email *</label>
          <input 
            type="email"
            [(ngModel)]="cliente.email"
            name="email"
            required
            class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
            placeholder="exemplo@email.com">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Telefone *</label>
          <input 
            type="text"
            [(ngModel)]="cliente.telefone"
            name="telefone"
            required
            class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
            placeholder="(11) 99999-9999">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Endereço *</label>
          <input 
            type="text"
            [(ngModel)]="cliente.endereco"
            name="endereco"
            required
            class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
            placeholder="Rua, número, bairro, cidade">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Cidade *</label>
          <input 
            type="text"
            [(ngModel)]="cliente.cidade"
            name="cidade"
            required
            class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Estado *</label>
          <select 
            [(ngModel)]="cliente.estado"
            name="estado"
            required
            class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
            <option value="">Selecione o estado</option>
            <option *ngFor="let estado of estadosBrasil" [value]="estado.sigla">
              {{ estado.sigla }} - {{ estado.nome }}
            </option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">CEP</label>
          <input 
            type="text"
            [(ngModel)]="cliente.cep"
            name="cep"
            class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
        </div>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Tamanho do Sistema (kW) *</label>
          <input 
            type="number"
            [(ngModel)]="cliente.tamanhoSistema"
            name="tamanhoSistema"
            required
            min="0.1"
            step="0.1"
            class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Custo Total (R$) *</label>
          <input 
            type="number"
            [(ngModel)]="cliente.custoTotal"
            name="custoTotal"
            required
            min="0"
            step="100"
            class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Data de Instalação *</label>
          <input 
            type="date"
            [(ngModel)]="cliente.dataInstalacao"
            name="dataInstalacao"
            required
            class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Tipo de Sistema *</label>
          <select 
            [(ngModel)]="cliente.tipoSistema"
            name="tipoSistema"
            required
            class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
            <option value="">Selecione o tipo</option>
            <option *ngFor="let tipo of tiposSistema" [value]="tipo.valor">
              {{ tipo.label }}
            </option>
          </select>
        </div>

        <div class="pt-4">
          <div class="flex items-center p-4 bg-emerald-50 rounded-lg border border-emerald-200">
            <input 
              type="checkbox"
              [(ngModel)]="cliente.ativo"
              name="ativo"
              id="ativo"
              class="w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500">
            <label for="ativo" class="ml-2 text-sm font-medium text-emerald-700">
              Cliente ativo
            </label>
          </div>
          <p class="text-xs text-slate-500 mt-1">Desmarque se o cliente estiver inativo</p>
        </div>
      </div>
    </div>

    <div class="pt-6 border-t border-slate-200">
      <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
        <div class="text-sm text-slate-500">
          <span class="text-rose-500">*</span> Campos obrigatórios
        </div>
        
        <div class="flex gap-3">
          <button 
            type="button"
            (click)="cancelar()"
            [disabled]="enviando"
            class="px-6 py-2 border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-100 transition disabled:opacity-50">
            Cancelar
          </button>
          
          <button 
            type="submit"
            [disabled]="enviando"
            class="px-6 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition flex items-center gap-2 disabled:opacity-50">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
            <span *ngIf="!enviando">Cadastrar Cliente</span>
            <span *ngIf="enviando">Salvando...</span>
          </button>
        </div>
      </div>
    </div>
  </form>
</div>
