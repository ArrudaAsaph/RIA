<div class="space-y-6">
  <!-- Cabeçalho -->
  <div class="flex justify-between items-center">
    <div>
      <h2 class="text-2xl font-bold text-gray-800">Gestão de Clientes</h2>
      <p class="text-gray-600">Gerencie seus clientes de energia solar</p>
      <p *ngIf="clientes.length > 0" class="text-sm text-gray-500">
        Total: {{ clientes.length }} cliente{{ clientes.length !== 1 ? 's' : '' }}
      </p>
    </div>
    <a 
      routerLink="/clientes/novo"
      class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
      </svg>
      Novo Cliente
    </a>
  </div>

  <!-- Mensagem de erro -->
  <div *ngIf="erro" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
    {{ erro }}
  </div>

  <!-- Loading -->
  <div *ngIf="carregando" class="text-center py-8">
    <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-green-500"></div>
    <p class="mt-2 text-gray-600">Carregando clientes...</p>
  </div>

  <!-- Conteúdo principal -->
  <div *ngIf="!carregando && !erro">
    <!-- Estatísticas -->
    <app-estatisticas-clientes [clientes]="clientes"></app-estatisticas-clientes>

    <!-- Lista de Clientes -->
    <div class="bg-white rounded-lg shadow">
      <div class="p-4 border-b">
        <h3 class="text-lg font-semibold">Lista de Clientes</h3>
        <p class="text-gray-600 text-sm">Clientes cadastrados no sistema</p>
      </div>
      <div class="p-4">
        <app-lista-clientes 
          [clientes]="clientes"
          (excluir)="excluirCliente($event)">
        </app-lista-clientes>
        
        <!-- Mensagem de lista vazia -->
        <div *ngIf="clientes.length === 0" class="text-center py-8 text-gray-500">
          Nenhum cliente cadastrado. 
          <a routerLink="/clientes/novo" class="text-blue-500 hover:text-blue-700 ml-1">
            Cadastre o primeiro cliente.
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
