<div class="space-y-6">
  <!-- Cabeçalho -->
  <div class="flex justify-between items-center">
    <div>
      <h2 class="text-2xl font-bold text-gray-800">Gestão de Clientes</h2>
      <p class="text-gray-600">Gerencie seus clientes de energia solar</p>
    </div>
    <a 
      routerLink="/clientes/novo"
      class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
      </svg>
      Novo Cliente
    </a>
  </div>

  <!-- Estatísticas -->
  <app-estatisticas-clientes [clientes]="clientes"></app-estatisticas-clientes>

  <!-- Lista de Clientes -->
  <div class="bg-white rounded-lg shadow">
    <div class="p-4 border-b">
      <h3 class="text-lg font-semibold">Lista de Clientes</h3>
    </div>
    <div class="p-4">
      <app-lista-clientes 
        [clientes]="clientes"
        (excluir)="excluirCliente($event)">
      </app-lista-clientes>
    </div>
  </div>
</div>
